# ============================================================
# Hexo 基础配置
# ============================================================
title: "Feetworld - Foot-focused photos & videos"
subtitle: ''
description: "Feetworld: Your destination for foot-focused photos and videos, showcasing warm, artistic foot portraits."
language: en
timezone: ''

# 最终域名（用户确认：直接覆盖原美足站，用 apex）
url: https://feetworld.cc
root: /
permalink: :title/

# 使用自定义 landing 主题
theme: landing

# ============================================================
# 引导页自定义变量（改这里就行，不用动代码）
# ============================================================
# PikPak 云盘文件链接（落地目标：先访问云盘文件，非广告词）
pikpak_url: "https://mypikpak.com/s/VP3V3ddFhPQOmLUf5IV7Ue3Go2"
cta_text: "OPEN PikPak"
brand: "Feetworld"
access_message: "Your destination for foot-focused photos and videos, showcasing warm, artistic foot portraits."
access_message2: "The website is not fully launched yet - please visit our PikPak cloud drive files first！"

# ============================================================
# 首页生成器（单页引导站必须，控制根 index.html 渲染）
# ============================================================
index_generator:
  path: ''
  per_page: 0
  order_by: '-date'

# ============================================================
# 部署（二选一，详见 README.md）
#   A. Cloudflare Pages：npx wrangler pages deploy public --project-name pikpak-landing
#   B. GitHub Pages：用 .github/workflows/pages-deploy.yml，push 到 main 自动部署
# ============================================================
deploy:
  type: ''
